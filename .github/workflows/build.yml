name: Build AY QUIZS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      # ========================================
      # CHECKOUT PROJECT
      # ========================================
      - name: Checkout project
        uses: actions/checkout@v4

      # ========================================
      # SETUP PYTHON
      # ========================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ========================================
      # SETUP JAVA
      # ========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ========================================
      # INSTALL SYSTEM DEPENDENCIES
      # ========================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            libltdl-dev

      # ========================================
      # INSTALL BUILDOZER
      # ========================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.34"

          echo ""
          echo "========================================"
          echo "BUILDOZER VERSION"
          echo "========================================"

          buildozer --version

      # ========================================
      # CHECK USER
      # ========================================
      - name: Check runner user
        run: |
          echo "========================================"
          echo "CHECKING RUNNER USER"
          echo "========================================"

          echo ""
          echo "WHOAMI:"
          whoami

          echo ""
          echo "ID:"
          id

      # ========================================
      # CHECK PROJECT
      # ========================================
      - name: Check project files
        run: |
          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          ls -la

          echo ""
          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          cat buildozer.spec

      # ========================================
      # CLEAN OLD BUILD
      # ========================================
      - name: Clean old Buildozer files
        run: |
          echo "========================================"
          echo "CLEANING OLD BUILD FILES"
          echo "========================================"

          rm -rf .buildozer
          rm -rf bin
          rm -rf build
          rm -rf dist

          echo ""
          echo "Clean complete."

      # ========================================
      # BUILD APK
      # ========================================
      - name: Build APK
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "STARTING AY QUIZS APK BUILD"
          echo "========================================"

          echo ""
          echo "CURRENT USER:"
          whoami

          echo ""
          echo "CURRENT ID:"
          id

          echo ""

          buildozer -v android debug 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD FINISHED"
          echo "BUILD EXIT CODE: $BUILD_EXIT"
          echo "========================================"

          echo ""
          echo "========================================"
          echo "SEARCHING FOR ERRORS"
          echo "========================================"

          grep -i -E \
            "error:|error |exception|command failed|failed:" \
            build.log | tail -n 100 || true

          echo ""
          echo "========================================"
          echo "LAST 150 LINES"
          echo "========================================"

          tail -n 150 build.log || true

          exit $BUILD_EXIT

      # ========================================
      # SHOW APK
      # ========================================
      - name: Show APK files
        if: success()
        run: |
          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          ls -lh bin/

      # ========================================
      # UPLOAD APK
      # ========================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AY-QUIZS-APK
          path: bin/*.apk
          if-no-files-found: error

      # ========================================
      # UPLOAD BUILD LOG
      # ========================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AY-QUIZS-build-log
          path: build.log
          if-no-files-found: warn
