name: Build AY QUIZS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    container:
      image: kivy/buildozer:latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check Python
        run: |
          python3 --version

      - name: Check Buildozer
        run: |
          buildozer --version

      - name: Check project files
        run: |
          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"
          ls -la

          echo ""
          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          cat buildozer.spec

      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        shell: bash
        run: |

          set +e

          echo "========================================"
          echo "STARTING AY QUIZS APK BUILD"
          echo "========================================"

          buildozer -v android debug 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD FINISHED"
          echo "BUILD EXIT CODE: $BUILD_EXIT"
          echo "========================================"

          echo ""
          echo "========================================"
          echo "SEARCHING FOR ERRORS"
          echo "========================================"

          grep -i -E \
            "error:|error |exception|command failed|failed:" \
            build.log | tail -n 100 || true

          echo ""
          echo "========================================"
          echo "LAST 150 LINES"
          echo "========================================"

          tail -n 150 build.log || true

          exit $BUILD_EXIT

      - name: Show APK files
        if: success()
        run: |
          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          ls -lh bin/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4

        with:
          name: AY-QUIZS-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: AY-QUIZS-build-log
          path: build.log
          if-no-files-found: warn
