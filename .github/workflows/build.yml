name: Build AY QUIZS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.34"
          python --version
          buildozer --version

      - name: Check project
        run: |
          whoami
          python --version
          ls -la
          cat buildozer.spec

      - name: Clean old build
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf build
          rm -rf dist

      - name: Build APK
        shell: bash
        run: |
          set +e
          buildozer -v android debug 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "BUILD EXIT CODE: $BUILD_EXIT"
          echo ""
          echo "===== ERRORS ====="

          grep -i -E \
            "error:|error |exception|command failed|failed:" \
            build.log | tail -n 100 || true

          echo ""
          echo "===== LAST 150 LINES ====="

          tail -n 150 build.log || true

          exit $BUILD_EXIT

      - name: Show APK
        if: success()
        run: |
          ls -lh bin/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AY-QUIZS-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AY-QUIZS-build-log
          path: build.log
          if-no-files-found: warn
